<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .stage {
          position: absolute;
          inset: 0;
          perspective: 1600px;
          perspective-origin: 50% 1000px;
        }
        #env {
          position: absolute;
          left: 320px;
          top: 985px;
          width: 440px;
          height: 290px;
          transform-style: preserve-3d;
        }
        .env-float,
        .env-body {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }
        .env-contact {
          position: absolute;
          left: 6%;
          right: 6%;
          top: 20%;
          bottom: -12%;
          border-radius: 50%;
          background: rgba(14, 11, 16, 0.5);
          filter: blur(30px);
          transform: translateZ(-60px);
        }
        .tex {
          background-image: url("assets/props/env-paper.png");
          background-size: 440px 290px;
        }
        .env-back {
          position: absolute;
          inset: 0;
          border-radius: 6px;
          filter: brightness(0.9);
          box-shadow: 0 24px 50px rgba(14, 11, 16, 0.45);
        }
        .env-flap {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 180px;
          clip-path: polygon(0 0, 100% 0, 52% 94%, 48% 94%);
          transform-origin: 50% 0%;
          filter: brightness(0.95);
        }
        .letter {
          position: absolute;
          left: 24px;
          top: 14px;
          width: 392px;
          height: 262px;
          border-radius: 3px;
          box-shadow: 0 -4px 14px rgba(14, 11, 16, 0.18);
        }
        .letter img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          border-radius: 3px;
        }
        .env-stamp {
          position: absolute;
          left: 58px;
          top: 18px;
          width: 280px;
          height: 125px;
          mix-blend-mode: multiply;
        }
        /* Front pocket: side + bottom panels with their seams catching light. */
        .env-front {
          position: absolute;
          inset: 0;
          border-radius: 6px;
          clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
        }
        .env-front::after {
          content: "";
          position: absolute;
          inset: 0;
          background:
            linear-gradient(32deg, rgba(14, 11, 16, 0.1), rgba(14, 11, 16, 0) 46%),
            linear-gradient(-32deg, rgba(14, 11, 16, 0.08), rgba(14, 11, 16, 0) 46%);
        }
        .env-sheen {
          position: absolute;
          inset: 0;
          border-radius: 6px;
          background: linear-gradient(112deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.5) 50%, rgba(255, 255, 255, 0) 62%);
          background-size: 300% 100%;
          mix-blend-mode: soft-light;
          clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
        }
      </style>

      <div id="root" data-composition-id="envelope" data-width="1080" data-height="1920">
        <div class="stage">
          <div id="env">
            <div class="env-float">
              <div class="env-contact"></div>
              <div class="env-body" id="env-body">
                <div class="env-back tex"></div>
                <div class="env-flap tex" id="env-flap"></div>
                <div class="letter" id="env-letter">
                  <img src="assets/props/letter.png" alt="" />
                  <img class="env-stamp" id="env-stamp" src="assets/props/stamp-rejected.png" alt="" />
                </div>
                <div class="env-front tex"></div>
                <div class="env-sheen" id="env-sheen"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Local time: this scene is mounted at 8.02s.
          const $ = (s) => document.querySelector(s);
          const float = $(".env-float"), sheen = $("#env-sheen");
          function render(t) {
            const ry = 3.5 * Math.sin(t * 1.9 + 2.1);
            float.style.transform = "translate3d(0," + (5 * Math.sin(t * 2.3 + 2)).toFixed(2) + "px,0) rotateX(" + (8 + 2 * Math.sin(t * 1.5)).toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) rotateZ(-1deg)";
            sheen.style.backgroundPosition = (60 - ry * 10).toFixed(1) + "% 50%";
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: 2.1, duration: 2.1, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);

          tl.set("#env", { autoAlpha: 0, x: 360, y: 520, rotation: 14, rotationY: -24, scale: 0.9 }, 0);
          tl.to("#env", { autoAlpha: 1, duration: 0.08, ease: "none" }, 0.02);
          tl.to("#env", { x: 0, y: 0, rotation: 0, rotationY: 0, duration: 0.5, ease: "expo.out" }, 0.02);
          tl.set("#env-flap", { rotationX: 0, z: 4 }, 0);
          tl.to("#env-flap", { rotationX: 180, z: -3, duration: 0.3, ease: "power2.inOut" }, 0.4);
          tl.set("#env-letter", { y: 0, z: 2 }, 0);
          tl.to("#env-letter", { y: -150, duration: 0.4, ease: "power3.out" }, 0.56);

          tl.set("#env-stamp", { autoAlpha: 0, scale: 1.3, rotation: -3 }, 0);
          tl.to("#env-stamp", { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.11, ease: "power3.in" }, 0.92);
          tl.to("#env-body", { scale: 0.985, z: -10, duration: 0.05, ease: "power2.out" }, 1.03);
          tl.to("#env-body", { scale: 1, z: 0, duration: 0.3, ease: "power2.out" }, 1.08);
          // Hands over to the SOP page at "It's called…" (source 9.56s).
          tl.to("#env", { y: 700, rotationX: -18, autoAlpha: 0, duration: 0.22, ease: "power2.in" }, 1.34);

          window.__timelines["envelope"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
