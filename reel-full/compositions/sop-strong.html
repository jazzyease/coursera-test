<!doctype html>
<!-- Template: tools/build.py writes one compositions/<host-id>.html per instance so the internal
     composition id and timeline key always equal the host id (a mismatch silently blanks media). -->
<html
  lang="en"
  data-composition-variables='[
    {"id":"mode","type":"enum","label":"Mode","default":"intro","options":[{"value":"intro","label":"Intro"},{"value":"weak","label":"Weak (red markup)"},{"value":"copies","label":"A hundred copies"},{"value":"strong","label":"Strong (tick)"}]},
    {"id":"inAt","type":"number","label":"Enter at (local s)","default":0.02,"step":0.01},
    {"id":"outAt","type":"number","label":"Exit at (local s, -1 = no exit)","default":-1,"step":0.01},
    {"id":"a","type":"number","label":"Beat A (local s)","default":-1,"step":0.01},
    {"id":"b","type":"number","label":"Beat B (local s)","default":-1,"step":0.01},
    {"id":"c","type":"number","label":"Beat C (local s)","default":-1,"step":0.01},
    {"id":"dur","type":"number","label":"Instance length (s)","default":3,"step":0.01}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .stage {
          position: absolute;
          inset: 0;
          perspective: 1600px;
          perspective-origin: 214px 840px;
        }
        /* Page rendered at 2x by tools/make_assets.py (sop_page); shown at 300x400. */
        /* Left column: her face (x≈420–720) and the right-edge Reels buttons stay clear, and the page
           ends above the caption block. */
        .sop {
          position: absolute;
          left: 64px;
          top: 640px;
          width: 300px;
          height: 400px;
          transform-style: preserve-3d;
        }
        .sop-float,
        .sop-body {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }
        .page {
          position: absolute;
          inset: 0;
          border-radius: 5px;
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.6),
            0 24px 48px rgba(14, 11, 16, 0.45),
            0 3px 8px rgba(14, 11, 16, 0.3);
        }
        .page img,
        .page canvas {
          position: absolute;
          left: 0;
          top: 0;
          width: 300px;
          height: 400px;
          border-radius: 5px;
        }
        .page canvas {
          mix-blend-mode: multiply;
        }
        .copy {
          filter: brightness(0.88);
        }
        .sheen {
          position: absolute;
          inset: 0;
          border-radius: 5px;
          background: linear-gradient(112deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 62%);
          background-size: 300% 100%;
          mix-blend-mode: soft-light;
        }
      </style>

      <div id="root" data-composition-id="sop-strong" data-width="1080" data-height="1920">
        <div class="stage">
          <div class="sop" id="sop">
            <div class="sop-float">
              <div class="sop-body" id="sop-body">
                <div class="page" id="main-page">
                  <img src="assets/props/sop-page.png" alt="" />
                  <canvas class="ink" width="600" height="800"></canvas>
                  <div class="sheen"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const $ = (s) => document.querySelector(s);
          const v = window.__hyperframes.getVariables();
          const mode = String(v.mode);
          const inAt = Number(v.inAt), outAt = Number(v.outAt), A = Number(v.a), B = Number(v.b), C = Number(v.c), DUR = Number(v.dur);
          const ease3 = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

          // ---------- Pen strokes (2x canvas coords; see make_assets.sop_page for the layout) ----------
          let seed = mode.length * 7919;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          const jitter = (pts, amt) => pts.map(([x, y]) => [x + (rnd() - 0.5) * amt, y + (rnd() - 0.5) * amt]);
          function squiggle(x0, x1, y, amp, waves) {
            const p = [];
            for (let i = 0; i <= 90; i++) {
              const t = i / 90;
              p.push([x0 + (x1 - x0) * t, y + Math.sin(t * Math.PI * 2 * waves) * amp]);
            }
            return jitter(p, 1.5);
          }
          const line = (x0, y0, x1, y1) => jitter(Array.from({ length: 40 }, (_, i) => [x0 + ((x1 - x0) * i) / 39, y0 + ((y1 - y0) * i) / 39]), 1.2);
          function box(x0, y0, x1, y1) {
            const p = [];
            const c = [[x0, y0], [x1, y0 + 4], [x1 - 3, y1], [x0 + 2, y1 - 3], [x0 - 2, y0 + 10]];
            for (let k = 0; k < c.length - 1; k++) for (let i = 0; i < 30; i++) p.push([c[k][0] + ((c[k + 1][0] - c[k][0]) * i) / 30, c[k][1] + ((c[k + 1][1] - c[k][1]) * i) / 30]);
            return jitter(p, 2);
          }
          const RED = "rgba(196, 30, 42, 0.9)", GREEN = "rgba(31, 138, 76, 0.95)";
          const STROKES = [];
          if (mode === "weak" || mode === "copies") {
            // A: generic goals -> wavy underline under two lines
            STROKES.push({ at: A, dur: 0.34, w: 5, col: RED, pts: squiggle(56, 540, 226, 4, 9) });
            STROKES.push({ at: A + 0.2, dur: 0.3, w: 5, col: RED, pts: squiggle(56, 470, 252, 4, 8) });
            // B: copied lines -> struck through
            STROKES.push({ at: B, dur: 0.24, w: 5, col: RED, pts: line(52, 361, 548, 359) });
            STROKES.push({ at: B + 0.16, dur: 0.24, w: 5, col: RED, pts: line(52, 387, 548, 385) });
            // C: zero personal story -> box around the empty block, crossed
            STROKES.push({ at: C, dur: 0.4, w: 5, col: RED, pts: box(50, 468, 550, 606) });
            STROKES.push({ at: C + 0.36, dur: 0.16, w: 5, col: RED, pts: line(250, 500, 350, 576) });
            STROKES.push({ at: C + 0.48, dur: 0.16, w: 5, col: RED, pts: line(350, 500, 250, 576) });
          }
          if (mode === "strong") {
            const tick = [];
            for (let i = 0; i <= 20; i++) tick.push([420 + i * 2.2, 90 + i * 2.6]);
            for (let i = 0; i <= 40; i++) tick.push([464 + i * 2.6, 142 - i * 3.6]);
            STROKES.push({ at: A, dur: 0.3, w: 9, col: GREEN, pts: jitter(tick, 1.2) });
          }
          const ctx = $("canvas.ink").getContext("2d");
          function drawInk(t) {
            ctx.clearRect(0, 0, 600, 800);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            for (const s of STROKES) {
              // "copies" continues the weak page across the cut: marks are already on it.
              const p = mode === "copies" ? 1 : ease3((t - s.at) / s.dur);
              if (s.at < 0 || p <= 0) continue;
              const n = Math.max(2, Math.floor(p * s.pts.length));
              ctx.strokeStyle = s.col;
              ctx.lineWidth = s.w;
              ctx.beginPath();
              ctx.moveTo(s.pts[0][0], s.pts[0][1]);
              for (let i = 1; i < n; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
              ctx.stroke();
            }
          }

          // ---------- A hundred copies: identical pages settle in behind the original ----------
          const COPIES = [];
          if (mode === "copies") {
            const body = $("#sop-body");
            for (let i = 0; i < 16; i++) {
              const el = document.createElement("div");
              el.className = "page copy";
              el.innerHTML = '<img src="assets/props/sop-page.png" alt="" />';
              body.insertBefore(el, body.firstChild);
              // Identical copies slap down into a pile behind the page, all inside the left column.
              COPIES.push({ el, x: -34 + rnd() * 70, y: -56 + rnd() * 100, rot: (rnd() - 0.5) * 26, z: -40 - i * 6, d: i * 0.04 });
            }
          }

          const float = $(".sop-float"), sheen = $(".sheen");
          function render(t) {
            const ry = 3.5 * Math.sin(t * 2 + 0.8);
            float.style.transform = "translate3d(0," + (5 * Math.sin(t * 2.4 + 0.3)).toFixed(2) + "px,0) rotateX(" + (6 + 2 * Math.sin(t * 1.6)).toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) rotateZ(-1deg)";
            sheen.style.backgroundPosition = (60 - ry * 10).toFixed(1) + "% 50%";
            drawInk(t);
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);

          if (mode === "copies") {
            tl.set("#sop", { autoAlpha: 1, y: 0, rotationX: 0, scale: 1 }, 0);
            COPIES.forEach((c) => {
              gsap.set(c.el, { x: -520, y: c.y + 160, rotation: c.rot - 30, z: c.z, autoAlpha: 0 });
              tl.set(c.el, { x: -520, y: c.y + 160, rotation: c.rot - 30, z: c.z, autoAlpha: 0 }, 0);
              tl.to(c.el, { x: c.x, y: c.y, rotation: c.rot, autoAlpha: 1, duration: 0.26, ease: "power3.out" }, A + c.d);
            });
          } else {
            gsap.set("#sop", { autoAlpha: 0, x: -420, y: 120, rotation: -14, scale: 0.92 });
            tl.set("#sop", { autoAlpha: 0, x: -420, y: 120, rotation: -14, scale: 0.92 }, 0);
            tl.to("#sop", { autoAlpha: 1, duration: 0.08, ease: "none" }, inAt);
            tl.to("#sop", { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.55, ease: "expo.out" }, inAt);
          }
          if (outAt >= 0) tl.to("#sop", { x: -460, rotation: -12, autoAlpha: 0, duration: 0.24, ease: "power2.in" }, outAt);

          window.__timelines["sop-strong"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
