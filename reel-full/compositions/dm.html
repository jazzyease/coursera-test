<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"typeAt","type":"number","label":"Start typing SOP (local s)","default":0.6,"step":0.01},
    {"id":"sendAt","type":"number","label":"Send (local s)","default":1.3,"step":0.01},
    {"id":"linkAt","type":"number","label":"Link in bio pill (local s)","default":1.9,"step":0.01},
    {"id":"outAt","type":"number","label":"Exit (local s)","default":2.7,"step":0.01}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Archivo";
          src: url("assets/fonts/Archivo-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
          font-style: normal;
        }
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        /* Neutral, unbranded message composer. */
        .dm {
          position: absolute;
          left: 190px;
          top: 860px;
          width: 700px;
          height: 300px;
          font-family: "Archivo", sans-serif;
        }
        .bubble {
          position: absolute;
          right: 0;
          top: 0;
          padding: 16px 30px 18px;
          border-radius: 30px 30px 8px 30px;
          background: linear-gradient(180deg, #f0fb8a, #e6f54a);
          color: #0e0b10;
          font-weight: 800;
          font-stretch: 110%;
          font-size: 44px;
          letter-spacing: 0.04em;
          box-shadow: 0 14px 30px rgba(14, 11, 16, 0.45);
          transform-origin: 100% 100%;
        }
        .sent {
          position: absolute;
          right: 8px;
          top: 96px;
          font-weight: 600;
          font-size: 22px;
          color: rgba(251, 251, 246, 0.85);
          text-shadow: 0 2px 8px rgba(14, 11, 16, 0.7);
        }
        .bar {
          position: absolute;
          left: 0;
          right: 0;
          top: 140px;
          height: 96px;
          border-radius: 48px;
          background: rgba(20, 17, 24, 0.78);
          box-shadow:
            inset 0 0 0 2px rgba(251, 251, 246, 0.16),
            0 18px 40px rgba(14, 11, 16, 0.5);
        }
        .ph,
        .typed {
          position: absolute;
          left: 40px;
          top: 26px;
          font-size: 38px;
          font-weight: 500;
          line-height: 1.1;
        }
        .ph {
          color: rgba(251, 251, 246, 0.45);
        }
        .typed {
          color: #fbfbf6;
          font-weight: 700;
          letter-spacing: 0.04em;
          white-space: nowrap;
        }
        .caret {
          display: inline-block;
          width: 3px;
          height: 38px;
          margin-left: 4px;
          vertical-align: -6px;
          background: #e6f54a;
        }
        .send {
          position: absolute;
          right: 14px;
          top: 14px;
          width: 68px;
          height: 68px;
          border-radius: 50%;
          background: #e6f54a;
        }
        .send svg {
          position: absolute;
          left: 17px;
          top: 17px;
          width: 34px;
          height: 34px;
        }
        .link {
          position: absolute;
          left: 50%;
          top: 262px;
          margin-left: -150px;
          width: 300px;
          height: 70px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          border-radius: 35px;
          background: #fbfbf6;
          color: #0e0b10;
          font-weight: 800;
          font-stretch: 108%;
          font-size: 32px;
          box-shadow: 0 14px 30px rgba(14, 11, 16, 0.45);
        }
        .link svg {
          width: 26px;
          height: 26px;
        }
      </style>

      <div id="root" data-composition-id="dm" data-width="1080" data-height="1920">
        <div class="dm" id="dm">
          <div class="bubble" id="bubble">SOP</div>
          <div class="sent" id="sent">Sent</div>
          <div class="bar" id="bar">
            <div class="ph" id="ph">Message…</div>
            <div class="typed" id="typed"><span id="chars"></span><span class="caret" id="caret"></span></div>
            <div class="send" id="send">
              <svg viewBox="0 0 24 24" fill="none" stroke="#0e0b10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
            </div>
          </div>
          <div class="link" id="link">
            <span>Link in bio</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="#0e0b10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8" /></svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const v = window.__hyperframes.getVariables();
          const T = Number(v.typeAt), S = Number(v.sendAt), L = Number(v.linkAt), O = Number(v.outAt);
          const chars = document.getElementById("chars");
          const typed = { n: 0 };
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#bar", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.02);
          tl.set(["#bubble", "#sent", "#link", "#typed"], { opacity: 0 }, 0);
          tl.set("#typed", { opacity: 1 }, T);
          tl.set("#ph", { opacity: 0 }, T);
          tl.fromTo(
            typed,
            { n: 0 },
            { n: 3, duration: 0.36, ease: "none", onUpdate: () => (chars.textContent = "SOP".slice(0, Math.round(typed.n))) },
            T,
          );
          tl.to("#send", { scale: 0.86, duration: 0.06, ease: "power2.out" }, S - 0.06);
          tl.to("#send", { scale: 1, duration: 0.2, ease: "power2.out" }, S);
          tl.set("#typed", { opacity: 0 }, S);
          tl.set("#ph", { opacity: 1 }, S);
          tl.fromTo("#bubble", { opacity: 0, y: 110, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out" }, S);
          tl.fromTo("#sent", { opacity: 0 }, { opacity: 1, duration: 0.2 }, S + 0.3);
          tl.fromTo("#link", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power3.out" }, L);
          tl.to("#dm", { opacity: 0, y: 20, duration: 0.24, ease: "power2.in" }, O);
          window.__timelines["dm"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
