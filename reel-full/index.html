          else if (s > a) return a - shift;
        }
        return s - shift;

        tl.set("#flash", { opacity: 0.4 }, o(7.54));              // "rejection" -> black and white

        tl.set("#bw-wrap", { opacity: 1 }, o(7.54));

        cam({ scale: 1.14 }, 31.0);                       // why this course
        cam({ scale: 1.22 }, 32.12);                      // why now
