<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .stage {
          position: absolute;
          inset: 0;
          perspective: 1600px;
          perspective-origin: 50% 900px;
        }
        /* Spread is rendered at 2x (tools/make_assets.py); shown at 674x474. */
        #pp {
          position: absolute;
          left: 203px;
          top: 755px;
          width: 674px;
          height: 474px;
          transform-style: preserve-3d;
        }
        .pp-float,
        .pp-body {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }
        .pp-contact {
          position: absolute;
          left: 4%;
          right: 4%;
          top: 14%;
          bottom: -10%;
          border-radius: 50%;
          background: rgba(14, 11, 16, 0.55);
          filter: blur(34px);
          transform: translateZ(-60px);
        }
        .pp-edge {
          position: absolute;
          inset: 3px 2px -5px 2px;
          border-radius: 22px;
          background: #111629;
          transform: translateZ(-7px);
        }
        .pp-img {
          position: absolute;
          left: 0;
          top: 0;
          width: 674px;
          height: 474px;
        }
        /* Soft specular sweep, clipped to the spread's alpha so it never lands on the video. */
        .pp-sheen {
          position: absolute;
          inset: 0;
          background: linear-gradient(112deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 62%);
          background-size: 300% 100%;
          mix-blend-mode: soft-light;
          -webkit-mask: url("assets/props/passport-spread.png") center / 100% 100% no-repeat;
          mask: url("assets/props/passport-spread.png") center / 100% 100% no-repeat;
        }
        /* Hologram shimmer: sits exactly over the foil patch on the visa sticker. */
        .pp-holo {
          position: absolute;
          left: 596px;
          top: 68px;
          width: 58px;
          height: 58px;
          border-radius: 50%;
          mix-blend-mode: overlay;
        }
        .pp-stamp {
          position: absolute;
          left: 367px;
          top: 267px;
          width: 290px;
          height: 129px;
          mix-blend-mode: multiply;
        }
      </style>

      <div id="root" data-composition-id="passport" data-width="1080" data-height="1920">
        <div class="stage">
          <div id="pp">
            <div class="pp-float">
              <div class="pp-contact"></div>
              <div class="pp-body">
                <div class="pp-edge"></div>
                <img class="pp-img" src="assets/props/passport-spread.png" alt="" />
                <img class="pp-stamp" src="assets/props/stamp-rejected.png" alt="" />
                <div class="pp-holo"></div>
                <div class="pp-sheen"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const $ = (s) => document.querySelector(s);
          const float = $(".pp-float");
          const sheen = $(".pp-sheen");
          const holo = $(".pp-holo");

          // Slow, low-amplitude hand-held drift; the sheen and hologram follow the tilt.
          function render(t) {
            const ry = 4 * Math.sin(t * 2.1 + 0.4);
            const rx = 9 + 2.5 * Math.sin(t * 1.7 + 1.1);
            const y = 5 * Math.sin(t * 2.6);
            float.style.transform = "translate3d(0," + y.toFixed(2) + "px,0) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) rotateZ(-1.5deg)";
            sheen.style.backgroundPosition = (60 - ry * 9).toFixed(1) + "% 50%";
            sheen.style.opacity = (0.55 + 0.25 * Math.sin(t * 2.1 + 0.4)).toFixed(3);
            holo.style.background = "conic-gradient(from " + (ry * 22).toFixed(1) + "deg, rgba(255,255,255,0.7), rgba(255,255,255,0) 30%, rgba(255,255,255,0.5) 55%, rgba(255,255,255,0) 80%, rgba(255,255,255,0.7))";
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: 1.98, duration: 1.98, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);

          tl.set("#pp", { autoAlpha: 0, y: 360, rotationX: 48, scale: 0.72 }, 0);
          tl.to("#pp", { autoAlpha: 1, duration: 0.12, ease: "none" }, 0.02);
          tl.to("#pp", { y: 0, rotationX: 0, scale: 0.86, duration: 0.62, ease: "expo.out" }, 0.02);

          // Stamp: presses down onto the page; the book gives slightly under it.
          tl.set(".pp-stamp", { autoAlpha: 0, scale: 1.3, rotation: -3 }, 0);
          tl.to(".pp-stamp", { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.11, ease: "power3.in" }, 0.85);
          tl.to(".pp-body", { scale: 0.985, z: -10, duration: 0.05, ease: "power2.out" }, 0.96);
          tl.to(".pp-body", { scale: 1, z: 0, duration: 0.3, ease: "power2.out" }, 1.01);

          tl.to("#pp", { x: 380, rotationY: 28, autoAlpha: 0, duration: 0.26, ease: "power2.in" }, 1.7);

          window.__timelines["passport"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
