<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Card label","default":"DOCUMENT"},
    {"id":"tilt","type":"number","label":"Resting tilt (deg)","default":-3,"min":-15,"max":15,"step":0.5},
    {"id":"enterFrom","type":"enum","label":"Entrance","default":"pop","options":[{"value":"pop","label":"Pop"},{"value":"bottom","label":"Rise from bottom"}]},
    {"id":"markAt","type":"number","label":"Red ring on key line at (s, -1 = off)","default":-1,"step":0.01},
    {"id":"highlight","type":"boolean","label":"Highlight key line","default":true},
    {"id":"stampAt","type":"number","label":"REJECTED stamp at (s, -1 = off)","default":-1,"step":0.01}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Archivo";
          src: url("assets/fonts/Archivo-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
          font-style: normal;
        }
        @font-face {
          font-family: "Archivo";
          src: url("assets/fonts/Archivo-Italic-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
          font-style: italic;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: visible;
        }
        .uc-card {
          position: absolute;
          inset: 0;
          border-radius: 28px;
          background: #fbfbf6;
          box-shadow:
            0 40px 80px rgba(14, 11, 16, 0.55),
            0 6px 18px rgba(14, 11, 16, 0.35),
            inset 0 0 0 2px rgba(14, 11, 16, 0.06);
          padding: 30px 32px;
          box-sizing: border-box;
          overflow: visible;
        }
        .uc-head {
          display: flex;
          align-items: center;
          gap: 16px;
        }
        .uc-icon {
          position: relative;
          display: block;
          width: 58px;
          height: 70px;
          border-radius: 10px;
          background: #e6f54a;
          box-shadow: inset 0 0 0 3px #0e0b10;
        }
        .uc-icon::before,
        .uc-icon::after {
          content: "";
          position: absolute;
          left: 13px;
          right: 13px;
          height: 5px;
          border-radius: 3px;
          background: #0e0b10;
        }
        .uc-icon::before {
          top: 24px;
        }
        .uc-icon::after {
          top: 38px;
          right: 22px;
        }
        .uc-label {
          font-family: "Archivo", sans-serif;
          font-weight: 800;
          font-stretch: 110%;
          font-size: 30px;
          letter-spacing: 0.04em;
          color: #0e0b10;
        }
        .uc-lines {
          position: relative;
          display: flex;
          flex-direction: column;
          gap: 18px;
          margin-top: 28px;
        }
        .uc-line {
          display: block;
          height: 16px;
          border-radius: 8px;
          background: #c9cbd3;
          transform-origin: left center;
        }
        .uc-line.uc-key {
          background: #e6f54a;
          box-shadow: inset 0 0 0 2px rgba(14, 11, 16, 0.25);
        }
        .uc-ring {
          position: absolute;
          left: -26px;
          top: 12px;
          width: 300px;
          height: 84px;
          overflow: visible;
        }
        .uc-stamp {
          position: absolute;
          left: 50%;
          top: 52%;
          margin-left: -136px;
          margin-top: -46px;
          width: 272px;
          height: 88px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 8px solid #ff2e3f;
          border-radius: 16px;
          box-sizing: border-box;
          background: rgba(251, 251, 246, 0.9);
          color: #ff2e3f;
          font-family: "Archivo", sans-serif;
          font-style: italic;
          font-weight: 900;
          font-stretch: 118%;
          font-size: 44px;
          letter-spacing: 0.01em;
          line-height: 1;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="ui-card" data-width="400" data-height="300">
        <div class="uc-card">
          <div class="uc-head"><span class="uc-icon"></span><span class="uc-label">DOCUMENT</span></div>
          <div class="uc-lines">
            <span class="uc-line" style="width: 94%"></span>
            <span class="uc-line uc-key" style="width: 80%"></span>
            <span class="uc-line" style="width: 88%"></span>
            <span class="uc-line" style="width: 58%"></span>
            <svg class="uc-ring" viewBox="0 0 300 84" aria-hidden="true">
              <path
                class="uc-ring-path"
                d="M22,46 C24,16 110,6 180,8 C252,10 292,24 286,46 C280,72 190,80 120,78 C52,76 10,66 16,40 C18,28 34,20 52,18"
                fill="none"
                stroke="#ff2e3f"
                stroke-width="7"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="uc-stamp">REJECTED</div>
        </div>
      </div>

      <script>
        (function () {
          // Classes, not ids: this component is mounted more than once.
          const v = window.__hyperframes.getVariables();
          const tilt = Number(v.tilt);
          document.querySelector(".uc-label").textContent = String(v.label);
          if (v.highlight === false || v.highlight === "false") document.querySelector(".uc-key").classList.remove("uc-key");
          const tl = gsap.timeline({ paused: true });

          const rise = v.enterFrom === "bottom";
          tl.fromTo(
            ".uc-card",
            rise ? { y: 900, x: 0, rotation: tilt + 12, scale: 1, opacity: 1 } : { y: 0, x: 0, rotation: tilt - 14, scale: 0.3, opacity: 0 },
            { y: 0, rotation: tilt, scale: 1, opacity: 1, duration: rise ? 0.5 : 0.36, ease: rise ? "expo.out" : "back.out(1.9)" },
            0,
          );
          tl.fromTo(".uc-lines .uc-line", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", stagger: 0.05 }, 0.14);

          const ring = document.querySelector(".uc-ring-path");
          const len = ring.getTotalLength();
          tl.set(ring, { strokeDasharray: len, strokeDashoffset: len }, 0);
          const m = Number(v.markAt);
          if (m >= 0) {
            tl.to(ring, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, m);
            tl.to(".uc-lines .uc-key", { backgroundColor: "#ff2e3f", duration: 0.12 }, m + 0.18);
            tl.to(".uc-card", { keyframes: [{ x: 10 }, { x: -8 }, { x: 6 }, { x: 0 }], duration: 0.16, ease: "none" }, m + 0.2);
          }

          const s = Number(v.stampAt);
          if (s >= 0) {
            tl.fromTo(
              ".uc-stamp",
              { scale: 2.2, rotation: -20, opacity: 0 },
              { scale: 1, rotation: -10, opacity: 1, duration: 0.13, ease: "power4.in" },
              s,
            );
            tl.to(".uc-card", { scale: 0.96, duration: 0.05, ease: "power2.out" }, s + 0.13);
            tl.to(".uc-card", { scale: 1, duration: 0.32, ease: "back.out(2)" }, s + 0.18);
          }

          window.__timelines["ui-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
